name: Generate Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate Keystore
    runs-on: ubuntu-24.04

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate and Verify Keystore
        shell: bash
        env:
          RAW_PASSWORD: ${{ secrets.PHONE_KEYSTORE_PASSWORD }}
          RAW_ALIAS: ${{ secrets.PHONE_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "$RAW_PASSWORD" ] || [ -z "$RAW_ALIAS" ]; then
            echo "::error::Required secrets PHONE_KEYSTORE_PASSWORD or PHONE_KEY_ALIAS are missing in repository secrets."
            exit 1
          fi

          # Strip trailing whitespace and newlines from secret values
          CLEAN_PASSWORD=$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n')
          CLEAN_ALIAS=$(printf '%s' "$RAW_ALIAS" | tr -d '\r\n')
          export CLEAN_PASSWORD

          # Generate PKCS12 keystore using keytool
          keytool -genkeypair \
            -keystore phone-release.jks \
            -storetype PKCS12 \
            -alias "$CLEAN_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Phone, O=elli0t0, C=IR" \
            -storepass:env CLEAN_PASSWORD \
            -keypass:env CLEAN_PASSWORD

          if [ ! -s phone-release.jks ]; then
            echo "::error::Failed to create phone-release.jks (file missing or empty)"
            exit 1
          fi

          # Verify keystore without printing alias list or secrets
          KEYTOOL_OUT=$(keytool -list -keystore phone-release.jks -storepass:env CLEAN_PASSWORD 2>&1) || {
            echo "::error::keytool failed to list keystore."
            exit 1
          }

          KS_TYPE=$(printf '%s\n' "$KEYTOOL_OUT" | grep -i "Keystore type:" | head -n 1 | awk -F: '{print $2}' | xargs || echo "Unknown")
          echo "Keystore type: $KS_TYPE"

          ENTRY_COUNT=$(printf '%s\n' "$KEYTOOL_OUT" | grep -i "entry" | grep -i -E "[0-9]+ entry|[0-9]+ entries" | head -n 1 | sed -E 's/.*([0-9]+) (entry|entries).*/\1/' || echo "")
          if [ -z "$ENTRY_COUNT" ]; then
            ENTRY_COUNT=$(printf '%s\n' "$KEYTOOL_OUT" | grep -c "PrivateKeyEntry" || echo "0")
          fi
          echo "Entry count: $ENTRY_COUNT"

          ALIAS_MATCH="no"
          if printf '%s\n' "$KEYTOOL_OUT" | grep -i -E "^${CLEAN_ALIAS}[[:space:]]*," > /dev/null; then
            ALIAS_MATCH="yes"
          fi
          echo "alias matches secret: $ALIAS_MATCH"

          if [ "$ALIAS_MATCH" = "no" ]; then
            echo "::error::Alias in generated keystore does not match configured secret!"
            exit 1
          fi

          # Generate base64 encoding without line wraps
          base64 -w0 phone-release.jks > keystore-base64.txt

          if [ ! -s keystore-base64.txt ]; then
            echo "::error::Failed to encode keystore to base64"
            exit 1
          fi

          echo "Keystore and Base64 output generated successfully."

      - name: Upload Keystore Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            phone-release.jks
            keystore-base64.txt
          retention-days: 1
          if-no-files-found: error
