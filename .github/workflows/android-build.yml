name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify APK
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify Gradle version
        run: gradle --version

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Validate release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PHONE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PHONE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PHONE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PHONE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Required release signing secrets are missing! Please configure PHONE_KEYSTORE_BASE64, PHONE_KEYSTORE_PASSWORD, PHONE_KEY_ALIAS, and PHONE_KEY_PASSWORD in repository secrets."
            exit 1
          fi
          echo "All release signing secrets are present."

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PHONE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::Failed to decode keystore into $RUNNER_TEMP/release.jks (file missing or 0 bytes)"
            exit 1
          fi
          echo "Release keystore decoded successfully."

      - name: Build Release APK
        env:
          PHONE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          PHONE_KEYSTORE_PASSWORD: ${{ secrets.PHONE_KEYSTORE_PASSWORD }}
          PHONE_KEY_ALIAS: ${{ secrets.PHONE_KEY_ALIAS }}
          PHONE_KEY_PASSWORD: ${{ secrets.PHONE_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify and analyze release APK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Neither ANDROID_HOME nor ANDROID_SDK_ROOT is set."
            exit 1
          fi

          if [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::Directory '$SDK_ROOT/build-tools' does not exist."
            exit 1
          fi

          BUILD_TOOLS_DIR=$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS_DIR" ] || [ ! -d "$BUILD_TOOLS_DIR" ]; then
            echo "::error::No Android build-tools installed under $SDK_ROOT/build-tools."
            exit 1
          fi

          echo "Selected Android build-tools directory: $BUILD_TOOLS_DIR"

          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          if [ ! -x "$AAPT2" ]; then
            echo "::error::aapt2 executable not found or not executable at $AAPT2"
            exit 1
          fi

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner executable not found or not executable at $APKSIGNER"
            exit 1
          fi

          echo "Using aapt2 at: $AAPT2"
          echo "Using apksigner at: $APKSIGNER"

          echo "=== Searching for Release APK ==="
          APK_FILE=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::Release APK not found in app/build/outputs/apk/release!"
            echo "Contents of app/build/outputs/apk/release:"
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi
          echo "Found release APK: $APK_FILE"

          echo "=== APK Badging (Package, VersionCode, VersionName) ==="
          "$AAPT2" dump badging "$APK_FILE" | grep -E "package: name=" || true

          echo "=== APK Signing Verification & SHA-256 ==="
          "$APKSIGNER" verify --print-certs "$APK_FILE"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phone-0.1.0
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
