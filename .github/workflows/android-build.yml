name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle version
        run: ./gradlew --version

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.PHONE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PHONE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PHONE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PHONE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Required release signing secrets are missing! Please configure PHONE_KEYSTORE_BASE64, PHONE_KEYSTORE_PASSWORD, PHONE_KEY_ALIAS, and PHONE_KEY_PASSWORD in repository secrets."
            exit 1
          fi
          echo "All release signing secrets are present."

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PHONE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::Failed to decode keystore into $RUNNER_TEMP/release.jks"
            exit 1
          fi

      - name: Build Release APK
        env:
          PHONE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          PHONE_KEYSTORE_PASSWORD: ${{ secrets.PHONE_KEYSTORE_PASSWORD }}
          PHONE_KEY_ALIAS: ${{ secrets.PHONE_KEY_ALIAS }}
          PHONE_KEY_PASSWORD: ${{ secrets.PHONE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify and analyze release APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::Release APK not found in app/build/outputs/apk/release!"
            exit 1
          fi
          echo "Found release APK: $APK_FILE"

          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android SDK build-tools at: $BUILD_TOOLS_DIR"

          echo "=== APK Badging (Package, VersionCode, VersionName) ==="
          "$BUILD_TOOLS_DIR/aapt2" dump badging "$APK_FILE" | grep -E "package: name=" || true

          echo "=== APK Signing Verification & SHA-256 ==="
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$APK_FILE"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phone-0.1.0
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
